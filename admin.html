<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glimpsy Admin — Content Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0e0c;
  --bg2: #1a1814;
  --bg3: #242018;
  --surface: #1e1c18;
  --surface2: #252320;
  --border: rgba(255,255,255,.08);
  --border2: rgba(255,255,255,.14);
  --text: #f0ede8;
  --muted: #8a8278;
  --light: #5a5650;
  --terra: #c96a3a;
  --terra-light: #d87d4a;
  --terra-pale: rgba(201,106,58,.12);
  --sage: #4a7055;
  --sage-light: #5a8a66;
  --sage-pale: rgba(74,112,85,.12);
  --amber: #c4a35a;
  --amber-pale: rgba(196,163,90,.1);
  --red: #c04040;
  --red-pale: rgba(192,64,64,.1);
  --green: #4a8a5a;
  --gold: #c4a35a;
  --shadow: 0 8px 32px rgba(0,0,0,.4);
  --shadow-sm: 0 2px 12px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-weight:300;}

/* ── LAYOUT ── */
.admin-wrap{display:grid;grid-template-columns:320px 1fr;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;
}
.sidebar-head{padding:28px 24px 20px;border-bottom:1px solid var(--border);}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;letter-spacing:.1em;color:var(--text);}
.brand em{font-style:italic;color:var(--terra-light);}
.brand-sub{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-top:3px;}

.sidebar-section{padding:20px 24px 0;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--light);}

.show-list{flex:1;overflow-y:auto;padding:12px 12px 20px;}
.show-list::-webkit-scrollbar{width:4px;}
.show-list::-webkit-scrollbar-track{background:transparent;}
.show-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

.show-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
  cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:4px;
}
.show-item:hover{background:var(--surface);border-color:var(--border);}
.show-item.active{background:var(--terra-pale);border-color:rgba(201,106,58,.3);}
.si-emoji{font-size:1.1rem;flex-shrink:0;}
.si-info{flex:1;min-width:0;}
.si-title{font-size:.78rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-meta{font-size:.6rem;color:var(--muted);margin-top:1px;}
.si-del{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:.8rem;padding:2px 5px;border-radius:3px;transition:all .15s;flex-shrink:0;}
.show-item:hover .si-del{opacity:1;}
.si-del:hover{background:var(--red-pale);}

.sidebar-add{padding:16px 12px;border-top:1px solid var(--border);}
.btn-add{
  width:100%;padding:11px;border-radius:6px;border:1.5px dashed var(--border2);
  background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.78rem;
  font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-add:hover{border-color:var(--terra);color:var(--terra);background:var(--terra-pale);}

/* ── MAIN ── */
.main{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:16px 32px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;
}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--muted);}
.topbar-title strong{color:var(--text);font-weight:600;}
.topbar-actions{margin-left:auto;display:flex;gap:10px;}
.btn{
  padding:9px 18px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:.78rem;
  font-weight:700;cursor:pointer;border:none;transition:all .18s;
}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border2);}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--text);}
.btn-primary{background:var(--terra);color:white;}
.btn-primary:hover{background:var(--terra-light);}
.btn-primary:disabled{background:var(--light);cursor:not-allowed;}
.btn-danger{background:var(--red-pale);color:var(--red);border:1px solid rgba(192,64,64,.2);}
.btn-danger:hover{background:var(--red);color:white;}

.content-area{flex:1;padding:32px;}

/* ── SEARCH PANEL ── */
.search-panel{max-width:700px;margin:0 auto;}
.search-head{text-align:center;margin-bottom:36px;}
.search-head h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;color:var(--text);margin-bottom:8px;}
.search-head h1 em{color:var(--terra-light);font-style:italic;}
.search-head p{font-size:.82rem;color:var(--muted);line-height:1.6;}

.search-type-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px;}
.type-btn{
  padding:7px 16px;border-radius:20px;border:1.5px solid var(--border2);
  background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.72rem;
  font-weight:700;cursor:pointer;transition:all .15s;
}
.type-btn.active{background:var(--terra);border-color:var(--terra);color:white;}
.type-btn:hover:not(.active){border-color:var(--terra);color:var(--terra);}

.search-bar{display:flex;gap:10px;margin-bottom:28px;}
.search-input{
  flex:1;padding:13px 18px;border-radius:6px;border:1.5px solid var(--border2);
  background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.9rem;outline:none;transition:border-color .15s;
}
.search-input:focus{border-color:var(--terra);}
.search-input::placeholder{color:var(--light);}
.btn-search{padding:13px 22px;border-radius:6px;background:var(--terra);color:white;
  border:none;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap;}
.btn-search:hover{background:var(--terra-light);}

.search-results{display:flex;flex-direction:column;gap:10px;}
.result-card{
  display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:8px;
  border:1.5px solid var(--border);background:var(--surface);cursor:pointer;
  transition:all .18s;
}
.result-card:hover{border-color:var(--terra);background:var(--surface2);}
.result-poster{width:44px;height:60px;border-radius:4px;object-fit:cover;background:var(--bg3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.result-poster img{width:44px;height:60px;border-radius:4px;object-fit:cover;}
.result-info{flex:1;}
.result-title{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:3px;}
.result-meta{font-size:.68rem;color:var(--muted);}
.result-action{font-size:.68rem;font-weight:700;color:var(--terra);white-space:nowrap;}

.no-results{text-align:center;padding:40px;color:var(--muted);font-size:.82rem;}

/* ── EDIT FORM ── */
.edit-form{max-width:900px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.full{grid-column:1/-1;}
.label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}
.input{
  padding:10px 13px;border-radius:5px;border:1.5px solid var(--border2);
  background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:.85rem;outline:none;transition:border-color .15s;
}
.input:focus{border-color:var(--terra);}
.input::placeholder{color:var(--light);}
textarea.input{resize:vertical;min-height:80px;line-height:1.5;}
select.input{cursor:pointer;}

.section-divider{
  font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;
  color:var(--text);border-bottom:1px solid var(--border);padding-bottom:10px;
  margin:24px 0 16px;letter-spacing:.02em;
}
.section-divider span{color:var(--muted);font-size:.7rem;font-family:'DM Sans',sans-serif;font-weight:400;margin-left:8px;}

/* Sliders */
.slider-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.slider-row{display:flex;flex-direction:column;gap:6px;}
.slider-top{display:flex;justify-content:space-between;align-items:center;}
.slider-name{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.slider-val{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:500;padding:2px 8px;border-radius:10px;}
.sv-0,.sv-1{background:rgba(74,138,90,.2);color:#6abf7a;}
.sv-2,.sv-3{background:rgba(196,163,90,.15);color:var(--amber);}
.sv-4,.sv-5{background:rgba(192,64,64,.15);color:#e08080;}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--terra);cursor:pointer;border:2px solid var(--bg2);}

/* Theme chips */
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.chip{
  padding:5px 12px;border-radius:20px;border:1.5px solid var(--border2);
  background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.65rem;
  font-weight:700;cursor:pointer;transition:all .15s;
}
.chip:hover{border-color:var(--terra);color:var(--terra);}
.chip.on{background:var(--terra-pale);border-color:rgba(201,106,58,.4);color:var(--terra-light);}

/* Poster preview */
.poster-preview-wrap{display:flex;gap:16px;align-items:flex-start;}
.poster-preview{width:80px;height:110px;border-radius:6px;background:var(--bg3);border:1.5px solid var(--border);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2rem;}
.poster-preview img{width:100%;height:100%;object-fit:cover;}
.poster-input-wrap{flex:1;}

/* Form actions */
.form-actions{display:flex;gap:12px;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}
.save-status{font-size:.72rem;color:var(--muted);margin-left:auto;}
.save-status.ok{color:var(--green);}
.save-status.err{color:var(--red);}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px;text-align:center;}
.empty-icon{font-size:3rem;opacity:.4;}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--muted);}
.empty-sub{font-size:.78rem;color:var(--light);max-width:300px;line-height:1.6;}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border2);
  color:var(--text);padding:12px 20px;border-radius:8px;font-size:.78rem;font-weight:500;
  box-shadow:var(--shadow);transform:translateY(80px);opacity:0;transition:all .25s;z-index:999;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-color:rgba(74,138,90,.4);color:#6abf7a;}
.toast.err{border-color:rgba(192,64,64,.3);color:#e08080;}

/* Loading spinner */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--terra);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;padding:20px 0;}
</style>
</head>
<body>

<div class="admin-wrap">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="brand">glimps<em>y</em></div>
      <div class="brand-sub">Content Admin</div>
    </div>
    <div class="sidebar-section" style="margin-bottom:8px;">Library <span id="show-count" style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-size:.65rem;"></span></div>
    <div class="show-list" id="show-list">
      <div class="loading-row"><span class="spinner"></span> Loading…</div>
    </div>
    <div class="sidebar-add">
      <button class="btn-add" onclick="showSearch()">
        <span>＋</span> Add a show / film / book
      </button>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">
        <strong>Glimpsy Admin</strong>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div class="content-area" id="content-area">
      <div class="empty-state">
        <div class="empty-icon">🎬</div>
        <div class="empty-title">Select a show to edit,<br>or add a new one</div>
        <div class="empty-sub">Use the search below to find a title — TMDB will auto-fill the details for you.</div>
        <button class="btn btn-primary" onclick="showSearch()" style="margin-top:8px">＋ Add your first show</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════ CONFIG ═══════════════
const SUPABASE_URL = 'https://adbhrxslhzevrfkrudvw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Z3cI6vhaMUAP-MOo4WH3MQ_wDH_5ikU';
const TMDB_KEY     = 'a7d3cc4ab198a61fd4473e5f90b0c745';
const TMDB_IMG     = 'https://image.tmdb.org/t/p/w342';
const TMDB_BASE    = 'https://api.themoviedb.org/3';
const GBOOKS_KEY   = 'AIzaSyAkBlwO870lkIoUroU9qp6TRNMrZZ0DFJw';

// ═══════════════ STATE ═══════════════
let SHOWS = [];
let currentShow = null;
let searchMode = 'tv'; // tv | movie | book

// ═══════════════ SUPABASE HELPERS ═══════════════
async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function loadShows() {
  try {
    SHOWS = await sbFetch('shows?select=*&order=id.asc');
    renderSidebar();
  } catch(e) {
    document.getElementById('show-list').innerHTML = `<div style="padding:16px;color:var(--red);font-size:.72rem;">Failed to load: ${e.message}</div>`;
  }
}

// ═══════════════ SIDEBAR ═══════════════
function renderSidebar() {
  const list = document.getElementById('show-list');
  const count = document.getElementById('show-count');
  count.textContent = `(${SHOWS.length})`;

  if (!SHOWS.length) {
    list.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.72rem;">No shows yet. Add one below!</div>`;
    return;
  }

  list.innerHTML = SHOWS.map(s => `
    <div class="show-item${currentShow && currentShow.id === s.id ? ' active' : ''}" onclick="editShow(${s.id})">
      <div class="si-emoji">${s.emoji || '🎬'}</div>
      <div class="si-info">
        <div class="si-title">${s.title}</div>
        <div class="si-meta">${s.type} · ${s.age || '—'}</div>
      </div>
      <button class="si-del" onclick="event.stopPropagation();deleteShow(${s.id},'${s.title.replace(/'/g,"\\'")}')">✕</button>
    </div>
  `).join('');
}

// ═══════════════ SEARCH PANEL ═══════════════
function showSearch() {
  currentShow = null;
  renderSidebar();
  document.getElementById('topbar-title').innerHTML = '<strong>Add a new title</strong>';
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content-area').innerHTML = `
    <div class="search-panel">
      <div class="search-head">
        <h1>Find a <em>title</em></h1>
        <p>Search for a TV show, film or book. We'll pull the details from TMDB or Google Books automatically.</p>
      </div>

      <div class="search-type-row">
        <button class="type-btn${searchMode==='tv'?' active':''}" onclick="setSearchMode('tv')">📺 TV Show</button>
        <button class="type-btn${searchMode==='movie'?' active':''}" onclick="setSearchMode('movie')">🎬 Film</button>
        <button class="type-btn${searchMode==='book'?' active':''}" onclick="setSearchMode('book')">📚 Book</button>
      </div>

      <div class="search-bar">
        <input class="search-input" id="search-q" placeholder="e.g. Bluey, Paddington, The Gruffalo…" 
               onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-search" onclick="doSearch()">Search →</button>
      </div>

      <div id="search-results"></div>
    </div>
  `;
  setTimeout(()=>document.getElementById('search-q')?.focus(), 50);
}

function setSearchMode(mode) {
  searchMode = mode;
  showSearch();
  setTimeout(()=>document.getElementById('search-q')?.focus(), 50);
}

async function doSearch() {
  const q = document.getElementById('search-q')?.value?.trim();
  if (!q) return;
  const box = document.getElementById('search-results');
  box.innerHTML = `<div class="loading-row"><span class="spinner"></span> Searching…</div>`;

  try {
    let results = [];
    if (searchMode === 'book') {
      results = await searchBooks(q);
    } else {
      results = await searchTMDB(q, searchMode);
    }
    if (!results.length) {
      box.innerHTML = `<div class="no-results">No results found for "<strong>${q}</strong>". Try a different spelling.</div>`;
      return;
    }
    box.innerHTML = results.map((r,i) => `
      <div class="result-card" onclick="selectResult(${i})">
        <div class="result-poster">
          ${r.posterUrl ? `<img src="${r.posterUrl}" onerror="this.parentNode.textContent='${r.emoji}'">` : r.emoji}
        </div>
        <div class="result-info">
          <div class="result-title">${r.title}</div>
          <div class="result-meta">${r.meta}</div>
        </div>
        <div class="result-action">Use this →</div>
      </div>
    `).join('');
    // Store results for selection
    window._searchResults = results;
  } catch(e) {
    box.innerHTML = `<div class="no-results" style="color:var(--red)">Search failed: ${e.message}</div>`;
  }
}

async function searchTMDB(q, type) {
  const endpoint = type === 'tv' ? 'tv' : 'movie';
  const res = await fetch(`${TMDB_BASE}/search/${endpoint}?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=en-GB`);
  const data = await res.json();
  return (data.results || []).slice(0, 6).map(r => ({
    source: 'tmdb',
    type: type,
    tmdbId: r.id,
    title: r.name || r.title,
    poster: r.poster_path || null,
    posterUrl: r.poster_path ? TMDB_IMG + r.poster_path : null,
    emoji: type === 'tv' ? '📺' : '🎬',
    year: (r.first_air_date || r.release_date || '').slice(0,4),
    meta: [(r.first_air_date || r.release_date || '').slice(0,4), r.genre_ids?.length ? 'TMDB' : ''].filter(Boolean).join(' · '),
    overview: r.overview,
    raw: r
  }));
}

async function searchBooks(q) {
  const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&key=${GBOOKS_KEY}&maxResults=6&langRestrict=en`);
  const data = await res.json();
  return (data.items || []).slice(0, 6).map(r => {
    const info = r.volumeInfo;
    const thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || null;
    return {
      source: 'books',
      type: 'book',
      googleId: r.id,
      title: info.title,
      poster: thumb,
      posterUrl: thumb,
      posterType: 'book',
      emoji: '📗',
      year: (info.publishedDate || '').slice(0,4),
      meta: [info.authors?.[0], (info.publishedDate||'').slice(0,4)].filter(Boolean).join(' · '),
      overview: info.description,
      raw: r
    };
  });
}

async function selectResult(i) {
  const r = window._searchResults[i];
  const box = document.getElementById('search-results');
  box.innerHTML = `<div class="loading-row"><span class="spinner"></span> Loading details…</div>`;

  let enriched = { ...r };

  if (r.source === 'tmdb' && r.type === 'tv') {
    // Fetch full TV details
    const detail = await fetch(`${TMDB_BASE}/tv/${r.tmdbId}?api_key=${TMDB_KEY}&language=en-GB&append_to_response=content_ratings`).then(x=>x.json());
    enriched.seasons = detail.number_of_seasons;
    enriched.dur = detail.episode_run_time?.[0] || null;
    enriched.genres = detail.genres?.map(g=>g.name) || [];
    enriched.rating = extractUKRating(detail.content_ratings?.results) || 'U';
    enriched.overview = detail.overview;
  } else if (r.source === 'tmdb' && r.type === 'movie') {
    const detail = await fetch(`${TMDB_BASE}/movie/${r.tmdbId}?api_key=${TMDB_KEY}&language=en-GB&append_to_response=release_dates`).then(x=>x.json());
    enriched.dur = detail.runtime || null;
    enriched.genres = detail.genres?.map(g=>g.name) || [];
    enriched.rating = extractUKMovieRating(detail.release_dates?.results) || 'PG';
    enriched.overview = detail.overview;
  }

  // Ask Claude to suggest scores
  const box2 = document.getElementById('search-results');
  if (box2) box2.innerHTML = `<div class="loading-row"><span class="spinner"></span> AI is scoring this title…</div>`;
  try {
    const aiScores = await getAIScores(enriched);
    Object.assign(enriched, aiScores);
  } catch(err) {
    console.warn('AI scoring failed, using defaults:', err);
  }

  openEditForm(null, enriched);
}

async function getAIScores(e) {
  const prompt = `You are a children's media expert helping rate content for Glimpsy, a parental guidance app for families with neurodivergent children.

Title: "${e.title}"
Type: ${e.type}
Genres: ${(e.genres||[]).join(', ')}
UK Rating: ${e.rating || 'unknown'}
Synopsis: "${e.overview || 'not available'}"

Return ONLY a valid JSON object with no explanation or markdown fences.

Fields:
- v: violence 0-5 (0=none, 1=cartoon slapstick, 2=mild action, 3=moderate, 4=strong, 5=graphic)
- f: fear/scary 0-5 (0=nothing, 1=mild tension, 2=some scary moments, 3=genuinely frightening, 4=very scary, 5=extreme)
- l: language 0-5 (0=none, 1=very mild, 2=mild, 3=moderate, 4=strong, 5=very strong)
- s: sexual content 0-5 (0=none, 5=explicit)
- pos: positive values 0-5
- roles: role models 0-5
- con: consumerism 0-5
- dr: drinking/drugs 0-5
- calm: how calm 0-10 (10=very calm like Bluey, 0=chaotic)
- cuts: editing pace 0-10 (0=slow, 10=very rapid like Peppa Pig)
- colour: colour intensity 0-5 (0=muted, 5=extremely bright)
- pace: overall pace 0-5
- csm: overall stimulation 1-10
- age: age range string e.g. "3-7", "All ages", "10+", "2-5"
- emoji: single best emoji for this title
- bg: soft muted hex colour e.g. "#b8d4e8"
- themes: array from ONLY: ["death","monsters","bullying","toilet-humour","mild-violence","scary","divorce","grief","guns","educational","positive-friendship","positive-empathy","family-values","family-conflict","mild-language","nudity","sexual-content","drug-use","gambling"]

Example: {"v":0,"f":1,"l":0,"s":0,"pos":5,"roles":5,"con":1,"dr":0,"calm":8,"cuts":4,"colour":3,"pace":2,"csm":2,"age":"All ages","emoji":"\ud83d\udc15","bg":"#b8d4e8","themes":["positive-friendship","educational"]}`;

  const res = await fetch('/api/score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [{ role: 'user', content: prompt }]
    })
  });

  const data = await res.json();
  const text = data.content?.[0]?.text || '{}';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function extractUKRating(results) {
  if (!results) return null;
  const uk = results.find(r => r.iso_3166_1 === 'GB');
  return uk?.rating_descriptions?.[0]?.rating || uk?.ratings?.[0]?.rating || null;
}
function extractUKMovieRating(results) {
  if (!results) return null;
  const uk = results.find(r => r.iso_3166_1 === 'GB');
  return uk?.release_dates?.[0]?.certification || null;
}

  const show = SHOWS.find(s => s.id === id);
  if (!show) return;

  renderSidebar();

  // Convert DB row to enriched format
  const enriched = {
    source: 'db',
    type: show.type,
    title: show.title,
    emoji: show.emoji,
    bg: show.bg,
    poster: show.poster,
    posterType: show.poster_type,
    year: '',
    seasons: show.seasons,
    dur: show.dur,
    rating: show.rating,
    csm: show.csm,
    genres: show.genres || [],
    overview: show.synopsis,
    v: show.v, f: show.f, l: show.l, s: show.s,
    pos: show.pos, roles: show.roles, con: show.con, dr: show.dr,
    calm: show.calm, cuts: show.cuts, colour: show.colour, pace: show.pace,
    themes: show.themes || [],
    platforms: show.platforms || [],
    age: show.age,

function updateSliderVal(key, val) {

  if (el) { el.textContent = val; el.className = `slider-val sv-${Math.min(5,parseInt(val))}`; }

function updatePosterPreview(val, type) {
  const preview = document.getElementById('poster-preview');
  if (!preview) return;
  const isExternal = type === 'book' || val.startsWith('http');
  const url = isExternal ? val : (val ? TMDB_IMG + val : null);
  preview.innerHTML = url ? `<img src="${url}" onerror="this.parentNode.textContent='🎬'">` : '🎬';
}

function toggleTheme(btn, theme) {
  btn.classList.toggle('on');
}

function addCustomTheme() {
  const inp = document.getElementById('custom-theme');
  const val = inp.value.trim().toLowerCase().replace(/\s+/g,'-');
  if (!val) return;
  const wrap = document.getElementById('themes-wrap');
  const btn = document.createElement('button');
  btn.className = 'chip on';
  btn.textContent = val.replace(/-/g,' ');
  btn.dataset.theme = val;
  btn.onclick = () => btn.classList.toggle('on');
  wrap.appendChild(btn);
  inp.value = '';
}

function addPlatformRow() {

// ═══════════════ SAVE ═══════════════
async function saveShow() {
  const statusEl = document.getElementById('save-status');
  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) saveBtn.disabled = true;
  if (statusEl) { statusEl.className = 'save-status'; statusEl.textContent = 'Saving…'; }

  try {
    const dbId = document.getElementById('f-dbid').value;
    const isUpdate = !!dbId;
    // For new shows, fetch the real max ID from Supabase to avoid conflicts
    let id;
    if (isUpdate) {
      id = parseInt(document.getElementById('f-id').value);
    } else {
      const maxRes = await sbFetch('shows?select=id&order=id.desc&limit=1');
      id = maxRes && maxRes.length ? maxRes[0].id + 1 : 1;
      document.getElementById('f-id').value = id;
    }

    // Gather themes
    const themes = [...document.querySelectorAll('#themes-wrap .chip.on')].map(c => c.dataset.theme);

    // Gather platforms
    const platRows = document.querySelectorAll('#platforms-wrap .form-grid');
    const platforms = [...platRows].map(row => ({
      n: row.querySelector('.plat-name')?.value?.trim() || '',
      i: row.querySelector('.plat-icon')?.value?.trim() || '',
      t: row.querySelector('.plat-type')?.value?.trim() || '',
      url: row.querySelector('.plat-url')?.value?.trim() || ''
    })).filter(p => p.n);

    const posterType = document.getElementById('f-poster-type')?.value || null;

    const payload = {
      id,
      type: document.getElementById('f-type').value,
      title: document.getElementById('f-title').value.trim(),
      emoji: document.getElementById('f-emoji').value.trim(),
      bg: document.getElementById('f-bg').value.trim(),
      poster: document.getElementById('f-poster').value.trim() || null,
      poster_type: posterType || null,
      age: document.getElementById('f-age').value.trim(),
      seasons: parseInt(document.getElementById('f-seasons').value) || null,
      dur: parseInt(document.getElementById('f-dur').value) || null,
      rating: document.getElementById('f-rating').value,
      csm: parseInt(document.getElementById('f-csm').value) || 5,
      genres: document.getElementById('f-genres').value.split(',').map(g=>g.trim()).filter(Boolean),
      v: parseInt(document.getElementById('f-v').value),
      f: parseInt(document.getElementById('f-f').value),
      l: parseInt(document.getElementById('f-l').value),
      s: parseInt(document.getElementById('f-s').value),
      pos: parseInt(document.getElementById('f-pos').value),
      roles: parseInt(document.getElementById('f-roles').value),
      con: parseInt(document.getElementById('f-con').value),
      dr: parseInt(document.getElementById('f-dr').value),
      calm: parseInt(document.getElementById('f-calm').value),
      cuts: parseInt(document.getElementById('f-cuts').value),
      colour: parseInt(document.getElementById('f-colour').value),
      pace: parseInt(document.getElementById('f-pace').value),
      themes,
      platforms,
      synopsis: document.getElementById('f-synopsis').value.trim(),
      eps: []
    };

    if (isUpdate) {
      await sbFetch(`shows?id=eq.${dbId}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: JSON.stringify(payload)
      });
      // Update local cache
      const idx = SHOWS.findIndex(s => s.id === parseInt(dbId));
      if (idx > -1) SHOWS[idx] = { ...SHOWS[idx], ...payload, id: parseInt(dbId) };
      toast('✅ Saved!', 'ok');
    } else {
      await sbFetch('shows', {
        method: 'POST',
        prefer: 'return=minimal',
        body: JSON.stringify(payload)
      });
      SHOWS.push({ ...payload });
      currentShow = payload;
      document.getElementById('f-dbid').value = id;
      toast('✅ Added to Supabase!', 'ok');
    }

    if (statusEl) { statusEl.className = 'save-status ok'; statusEl.textContent = '✓ Saved successfully'; }
    renderSidebar();
  } catch(e) {
    console.error(e);
    if (statusEl) { statusEl.className = 'save-status err'; statusEl.textContent = '✕ Error: ' + e.message; }
    toast('Error saving: ' + e.message, 'err');
  }
  if (saveBtn) saveBtn.disabled = false;
}

// ═══════════════ DELETE ═══════════════
async function deleteShow(id, title) {
  if (!confirm(`Delete "${title}" from Supabase? This cannot be undone.`)) return;
  try {
    await sbFetch(`shows?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    SHOWS = SHOWS.filter(s => s.id !== id);
    currentShow = null;
    renderSidebar();
    showSearch();
    toast(`🗑 "${title}" deleted`, 'ok');
  } catch(e) {
    toast('Delete failed: ' + e.message, 'err');
  }
}

// ═══════════════ UTILS ═══════════════
function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2800);
}
