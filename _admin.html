<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glimpsy Admin — Content Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0f0e0c;
      --bg2: #1a1814;
      --bg3: #242018;
      --surface: #1e1c18;
      --surface2: #252320;
      --border: rgba(255, 255, 255, .08);
      --border2: rgba(255, 255, 255, .14);
      --text: #f0ede8;
      --muted: #8a8278;
      --light: #5a5650;
      --terra: #c96a3a;
      --terra-light: #d87d4a;
      --terra-pale: rgba(201, 106, 58, .12);
      --sage: #4a7055;
      --sage-light: #5a8a66;
      --sage-pale: rgba(74, 112, 85, .12);
      --amber: #c4a35a;
      --red: #c04040;
      --red-pale: rgba(192, 64, 64, .1);
      --green: #4a8a5a;
      --shadow: 0 8px 32px rgba(0, 0, 0, .4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0 }
    html { scroll-behavior: smooth }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-weight: 300 }
    .admin-wrap { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh }
    .sidebar { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden }
    .sidebar-head { padding: 28px 24px 20px; border-bottom: 1px solid var(--border) }
    .brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 300; letter-spacing: .1em; color: var(--text) }
    .brand em { font-style: italic; color: var(--terra-light) }
    .brand-sub { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-top: 3px }
    .sidebar-section { padding: 20px 24px 0; font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--light) }
    .show-list { flex: 1; overflow-y: auto; padding: 12px 12px 20px }
    .show-list::-webkit-scrollbar { width: 4px }
    .show-list::-webkit-scrollbar-track { background: transparent }
    .show-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px }
    .show-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; cursor: pointer; transition: all .15s; border: 1px solid transparent; margin-bottom: 4px }
    .show-item:hover { background: var(--surface); border-color: var(--border) }
    .show-item.active { background: var(--terra-pale); border-color: rgba(201, 106, 58, .3) }
    .si-emoji { font-size: 1.1rem; flex-shrink: 0 }
    .si-info { flex: 1; min-width: 0 }
    .si-title { font-size: .78rem; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .si-meta { font-size: .6rem; color: var(--muted); margin-top: 1px }
    .si-del { opacity: 0; background: none; border: none; color: var(--red); cursor: pointer; font-size: .8rem; padding: 2px 5px; border-radius: 3px; transition: all .15s; flex-shrink: 0 }
    .show-item:hover .si-del { opacity: 1 }
    .si-del:hover { background: var(--red-pale) }
    .sidebar-add { padding: 16px 12px; border-top: 1px solid var(--border) }
    .btn-add { width: 100%; padding: 11px; border-radius: 6px; border: 1.5px dashed var(--border2); background: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 500; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px }
    .btn-add:hover { border-color: var(--terra); color: var(--terra); background: var(--terra-pale) }
    .main { display: flex; flex-direction: column; min-height: 100vh }
    .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 50 }
    .topbar-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 400; color: var(--muted) }
    .topbar-title strong { color: var(--text); font-weight: 600 }
    .topbar-actions { margin-left: auto; display: flex; gap: 10px }
    .btn { padding: 9px 18px; border-radius: 5px; font-family: 'DM Sans', sans-serif; font-size: .78rem; font-weight: 700; cursor: pointer; border: none; transition: all .18s }
    .btn-ghost { background: rgba(255,255,255,.06); color: var(--muted); border: 1px solid var(--border2) }
    .btn-ghost:hover { background: rgba(255,255,255,.1); color: var(--text) }
    .btn-primary { background: var(--terra); color: white }
    .btn-primary:hover { background: var(--terra-light) }
    .btn-primary:disabled { background: var(--light); cursor: not-allowed }
    .btn-danger { background: var(--red-pale); color: var(--red); border: 1px solid rgba(192,64,64,.2) }
    .btn-danger:hover { background: var(--red); color: white }
    .content-area { flex: 1; padding: 32px }
    .search-panel { max-width: 700px; margin: 0 auto }
    .search-head { text-align: center; margin-bottom: 36px }
    .search-head h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; font-weight: 300; color: var(--text); margin-bottom: 8px }
    .search-head h1 em { color: var(--terra-light); font-style: italic }
    .search-head p { font-size: .82rem; color: var(--muted); line-height: 1.6 }
    .search-type-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px }
    .type-btn { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border2); background: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 700; cursor: pointer; transition: all .15s }
    .type-btn.active { background: var(--terra); border-color: var(--terra); color: white }
    .type-btn:hover:not(.active) { border-color: var(--terra); color: var(--terra) }
    .search-bar { display: flex; gap: 10px; margin-bottom: 28px }
    .search-input { flex: 1; padding: 13px 18px; border-radius: 6px; border: 1.5px solid var(--border2); background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .9rem; outline: none; transition: border-color .15s }
    .search-input:focus { border-color: var(--terra) }
    .search-input::placeholder { color: var(--light) }
    .btn-search { padding: 13px 22px; border-radius: 6px; background: var(--terra); color: white; border: none; font-family: 'DM Sans', sans-serif; font-size: .85rem; font-weight: 700; cursor: pointer; transition: all .18s; white-space: nowrap }
    .btn-search:hover { background: var(--terra-light) }
    .search-results { display: flex; flex-direction: column; gap: 10px }
    .result-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; transition: all .18s }
    .result-card:hover { border-color: var(--terra); background: var(--surface2) }
    .result-poster { width: 44px; height: 60px; border-radius: 4px; object-fit: cover; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem }
    .result-poster img { width: 44px; height: 60px; border-radius: 4px; object-fit: cover }
    .result-info { flex: 1 }
    .result-title { font-size: .88rem; font-weight: 600; color: var(--text); margin-bottom: 3px }
    .result-meta { font-size: .68rem; color: var(--muted) }
    .result-action { font-size: .68rem; font-weight: 700; color: var(--terra); white-space: nowrap }
    .no-results { text-align: center; padding: 40px; color: var(--muted); font-size: .82rem }
    .edit-form { max-width: 900px }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px }
    .field { display: flex; flex-direction: column; gap: 6px }
    .field.full { grid-column: 1/-1 }
    .label { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
    .input { padding: 10px 13px; border-radius: 5px; border: 1.5px solid var(--border2); background: var(--surface); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .85rem; outline: none; transition: border-color .15s }
    .input:focus { border-color: var(--terra) }
    .input::placeholder { color: var(--light) }
    textarea.input { resize: vertical; min-height: 80px; line-height: 1.5 }
    select.input { cursor: pointer }
    .section-divider { font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin: 24px 0 16px; letter-spacing: .02em }
    .section-divider span { color: var(--muted); font-size: .7rem; font-family: 'DM Sans', sans-serif; font-weight: 400; margin-left: 8px }
    .slider-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px }
    .slider-row { display: flex; flex-direction: column; gap: 6px }
    .slider-top { display: flex; justify-content: space-between; align-items: center }
    .slider-name { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
    .slider-val { font-family: 'DM Mono', monospace; font-size: .72rem; font-weight: 500; padding: 2px 8px; border-radius: 10px }
    .sv-0,.sv-1 { background: rgba(74,138,90,.2); color: #6abf7a }
    .sv-2,.sv-3 { background: rgba(196,163,90,.15); color: var(--amber) }
    .sv-4,.sv-5 { background: rgba(192,64,64,.15); color: #e08080 }
    input[type=range] { width: 100%; -webkit-appearance: none; height: 4px; border-radius: 2px; background: var(--border2); outline: none; cursor: pointer }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--terra); cursor: pointer; border: 2px solid var(--bg2) }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
    .chip { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border2); background: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: .65rem; font-weight: 700; cursor: pointer; transition: all .15s }
    .chip:hover { border-color: var(--terra); color: var(--terra) }
    .chip.on { background: var(--terra-pale); border-color: rgba(201,106,58,.4); color: var(--terra-light) }
    .chip.on.sage { background: var(--sage-pale); border-color: rgba(74,112,85,.4); color: var(--sage-light) }
    .chip.on.red { background: var(--red-pale); border-color: rgba(192,64,64,.3); color: #e08080 }
    .poster-preview-wrap { display: flex; gap: 16px; align-items: flex-start }
    .poster-preview { width: 80px; height: 110px; border-radius: 6px; background: var(--bg3); border: 1.5px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2rem }
    .poster-preview img { width: 100%; height: 100%; object-fit: cover }
    .poster-input-wrap { flex: 1 }
    .form-actions { display: flex; gap: 12px; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border) }
    .save-status { font-size: .72rem; color: var(--muted); margin-left: auto }
    .save-status.ok { color: var(--green) }
    .save-status.err { color: var(--red) }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 60px; text-align: center }
    .empty-icon { font-size: 3rem; opacity: .4 }
    .empty-title { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 300; color: var(--muted) }
    .empty-sub { font-size: .78rem; color: var(--light); max-width: 300px; line-height: 1.6 }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border2); color: var(--text); padding: 12px 20px; border-radius: 8px; font-size: .78rem; font-weight: 500; box-shadow: var(--shadow); transform: translateY(80px); opacity: 0; transition: all .25s; z-index: 999 }
    .toast.show { transform: translateY(0); opacity: 1 }
    .toast.ok { border-color: rgba(74,138,90,.4); color: #6abf7a }
    .toast.err { border-color: rgba(192,64,64,.3); color: #e08080 }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--terra); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px }
    @keyframes spin { to { transform: rotate(360deg) } }
    .loading-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .8rem; padding: 20px 0 }
    .ai-assess-banner { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; padding: 16px; border: 1.5px solid rgba(201,106,58,.25); border-radius: 8px; background: var(--terra-pale) }
    .ai-assess-banner-info { flex: 1 }
    .ai-assess-banner-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--terra-light); margin-bottom: 3px }
    .ai-assess-banner-sub { font-size: .72rem; color: var(--muted); line-height: 1.5 }
    .ai-assess-banner-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px }
    .ai-assess-status { font-size: .65rem; color: var(--muted) }
  </style>
</head>

<body>
  <div class="admin-wrap">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand">glimps<em>y</em></div>
        <div class="brand-sub">Content Admin</div>
      </div>
      <div class="sidebar-section" style="margin-bottom:8px;">Library <span id="show-count"
          style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-size:.65rem;"></span>
      </div>
      <div class="show-list" id="show-list">
        <div class="loading-row"><span class="spinner"></span> Loading…</div>
      </div>
      <div class="sidebar-add">
        <button class="btn-add" onclick="showSearch()"><span>＋</span> Add a show / film / book</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="topbar-title" id="topbar-title"><strong>Glimpsy Admin</strong></div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div class="content-area" id="content-area">
        <div class="empty-state">
          <div class="empty-icon">🎬</div>
          <div class="empty-title">Select a show to edit,<br>or add a new one</div>
          <div class="empty-sub">Use the search below to find a title — TMDB will auto-fill the details for you.</div>
          <button class="btn btn-primary" onclick="showSearch()" style="margin-top:8px">＋ Add your first show</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
        // ═══════════════ CONFIG ═══════════════
    const SUPABASE_URL = 'https://adbhrxslhzevrfkrudvw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Z3cI6vhaMUAP-MOo4WH3MQ_wDH_5ikU';
    const TMDB_KEY = 'a7d3cc4ab198a61fd4473e5f90b0c745';
    const TMDB_IMG = 'https://image.tmdb.org/t/p/w342';
    const TMDB_BASE = 'https://api.themoviedb.org/3';
    const GBOOKS_KEY = 'AIzaSyAkBlwO870lkIoUroU9qp6TRNMrZZ0DFJw';

    let SHOWS = [], currentShow = null, searchMode = 'tv';

    const ALL_THEMES = ['death', 'monsters', 'bullying', 'toilet-humour', 'mild-violence', 'scary', 'divorce', 'grief', 'guns', 'educational', 'positive-friendship', 'positive-empathy', 'family-values', 'family-conflict', 'mild-language', 'nudity', 'sexual-content', 'drug-use', 'gambling'];
    const ALL_NEURO_PILLS = ['low-sensory-load', 'autism-friendly', 'stimming-friendly', 'adhd-engagement', 'calming-transition', 'executive-function', 'co-viewing-recommended', 'bedtime-safe'];
    const ALL_WARNING_FLAGS = [
      { id: 'loud_sudden_sounds', label: '⚠ Loud sudden sounds' },
      { id: 'flashing_lights', label: '⚠ Flashing lights' },
      { id: 'orienting_reflex', label: '⚠ Orienting reflex' },
      { id: 'scary_content', label: '⚠ Scary content' },
      { id: 'violence_detected', label: '⚠ Violence detected' }
    ];

    const DEFAULT_PLATFORMS = {
      tv: [
        { n: 'BBC iPlayer', i: '📺', t: 'Free', url: 'https://www.bbc.co.uk/iplayer' },
        { n: 'Netflix', i: '🎬', t: 'Subscription', url: 'https://www.netflix.com' },
        { n: 'Disney+', i: '✨', t: 'Subscription', url: 'https://www.disneyplus.com' },
        { n: 'Prime Video', i: '📦', t: 'Subscription', url: 'https://www.amazon.co.uk/primevideo' },
        { n: 'ITVX', i: '📡', t: 'Free', url: 'https://www.itv.com/watch' },
        { n: 'YouTube', i: '▶️', t: 'Free', url: 'https://www.youtube.com' },
      ],
      movie: [
        { n: 'Netflix', i: '🎬', t: 'Subscription', url: 'https://www.netflix.com' },
        { n: 'Disney+', i: '✨', t: 'Subscription', url: 'https://www.disneyplus.com' },
        { n: 'Prime Video', i: '📦', t: 'Subscription', url: 'https://www.amazon.co.uk/primevideo' },
        { n: 'BBC iPlayer', i: '📺', t: 'Free', url: 'https://www.bbc.co.uk/iplayer' },
      ],
      book: [
        { n: 'Amazon', i: '📦', t: 'Buy', url: 'https://www.amazon.co.uk' },
        { n: 'Waterstones', i: '📚', t: 'Buy', url: 'https://www.waterstones.com' },
        { n: 'Library', i: '🏛️', t: 'Free', url: 'https://www.librarieswest.org.uk' },
      ]
    };

    // ═══ SUPABASE ═══
    async function sbFetch(path, opts = {}) {
      const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
        ...opts,
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': opts.prefer || '', ...(opts.headers || {}) }
      });
      if (!res.ok) { const err = await res.text(); throw new Error(err); }
      if (res.status === 204 || res.status === 201) return null;
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    async function loadShows() {
      try { SHOWS = await sbFetch('shows?select=*&order=id.asc'); renderSidebar(); }
      catch (e) { document.getElementById('show-list').innerHTML = `<div style="padding:16px;color:var(--red);font-size:.72rem;">Failed to load: ${e.message}</div>`; }
    }

    // ═══ SIDEBAR ═══
    function renderSidebar() {
      const list = document.getElementById('show-list');
      document.getElementById('show-count').textContent = `(${SHOWS.length})`;
      if (!SHOWS.length) { list.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.72rem;">No shows yet. Add one below!</div>`; return; }
      list.innerHTML = SHOWS.map(s => `
        <div class="show-item${currentShow && currentShow.id === s.id ? ' active' : ''}" onclick="editShow(${s.id})">
          <div class="si-emoji">${s.emoji || '🎬'}</div>
          <div class="si-info"><div class="si-title">${s.title}</div><div class="si-meta">${s.type} · ${s.age || '—'}</div></div>
          <button class="si-del" onclick="event.stopPropagation();deleteShow(${s.id},'${s.title.replace(/'/g, "\\'")}')">✕</button>
        </div>`).join('');
    }

    // ═══ SEARCH ═══
    function showSearch() {
      currentShow = null; renderSidebar();
      document.getElementById('topbar-title').innerHTML = '<strong>Add a new title</strong>';
      document.getElementById('topbar-actions').innerHTML = '';
      document.getElementById('content-area').innerHTML = `
        <div class="search-panel">
          <div class="search-head"><h1>Find a <em>title</em></h1><p>Search for a TV show, film or book. We'll pull the details from TMDB or Google Books automatically.</p></div>
          <div class="search-type-row">
            <button class="type-btn${searchMode === 'tv' ? ' active' : ''}" onclick="setSearchMode('tv')">📺 TV Show</button>
            <button class="type-btn${searchMode === 'movie' ? ' active' : ''}" onclick="setSearchMode('movie')">🎬 Film</button>
            <button class="type-btn${searchMode === 'book' ? ' active' : ''}" onclick="setSearchMode('book')">📚 Book</button>
          </div>
          <div class="search-bar">
            <input class="search-input" id="search-q" placeholder="e.g. Bluey, Paddington, The Gruffalo…" onkeydown="if(event.key==='Enter')doSearch()">
            <button class="btn-search" onclick="doSearch()">Search →</button>
          </div>
          <div id="search-results"></div>
        </div>`;
      setTimeout(() => document.getElementById('search-q')?.focus(), 50);
    }

    function setSearchMode(mode) { searchMode = mode; showSearch(); setTimeout(() => document.getElementById('search-q')?.focus(), 50); }

    async function doSearch() {
      const q = document.getElementById('search-q')?.value?.trim();
      if (!q) return;
      const box = document.getElementById('search-results');
      box.innerHTML = `<div class="loading-row"><span class="spinner"></span> Searching…</div>`;
      try {
        let results = searchMode === 'book' ? await searchBooks(q) : await searchTMDB(q, searchMode);
        if (!results.length) { box.innerHTML = `<div class="no-results">No results found for "<strong>${q}</strong>".</div>`; return; }
        box.innerHTML = results.map((r, i) => `
          <div class="result-card" onclick="selectResult(${i})">
            <div class="result-poster">${r.posterUrl ? `<img src="${r.posterUrl}" onerror="this.parentNode.textContent='${r.emoji}'">` : r.emoji}</div>
            <div class="result-info"><div class="result-title">${r.title}</div><div class="result-meta">${r.meta}</div></div>
            <div class="result-action">Use this →</div>
          </div>`).join('');
        window._searchResults = results;
      } catch (e) { box.innerHTML = `<div class="no-results" style="color:var(--red)">Search failed: ${e.message}</div>`; }
    }

    async function searchTMDB(q, type) {
      const res = await fetch(`${TMDB_BASE}/search/${type === 'tv' ? 'tv' : 'movie'}?api_key=${TMDB_KEY}&query=${encodeURIComponent(q)}&language=en-GB`);
      const data = await res.json();

    // ═══ QUICK AI SCORE ═══
    async function getAIScores(e) {
      const prompt = `You are a children's content analyst for Glimpsy, a parental guidance platform for families with neurodivergent children. Always address parents, never children.

TITLE: "${e.title}"
TYPE: ${e.type}
GENRES: ${(e.genres || []).join(', ')}
AGE RATING: ${e.rating || 'unknown'}
SYNOPSIS: "${e.overview || 'not available'}"

Return ONLY a valid JSON object — no preamble, no markdown fences.

violence (0–5): 0=none,1=cartoon slapstick,2=mild action,3=some combat,4=strong violence,5=graphic
fear_fantasy (0–5): 0=nothing scary,1=mild peril,2=some scary moments,3=frightening,4=very frightening,5=extreme
fear_realistic (0–5): 0=no threat,1=mild tension,2=some peril resolves,3=frightening,4=very frightening,5=extreme

social_safety (0–5): 0=respectful,1=minor friction,2=some bullying addressed,3=unresolved,4=normalised,5=glorified

one_line_summary: max 20 words for parents
themes: array from ["death","monsters","bullying","toilet-humour","mild-violence","scary","divorce","grief","guns","educational","positive-friendship","positive-empathy","family-values","family-conflict","mild-language","nudity","sexual-content","drug-use","gambling","social-skills","sensory-friendly","repetitive-structure","clear-narrative","loud-music","flashing-lights","social-exclusion","cyberbullying"]
neuro_pills: array from ["low-sensory-load","autism-friendly","stimming-friendly","adhd-engagement","calming-transition","executive-function","co-viewing-recommended","bedtime-safe"]
loud_sudden_sounds: true/false — sudden shocks only, NOT upbeat theme tunes

violence_detected: true/false

sensory_notes: one sentence for parents

Return JSON with exactly these keys: violence,fear_fantasy,fear_realistic,language_mild,language_freq,sex_nudity,social_safety,positive_messages,role_models,consumerism,drink_drugs,calm,cuts,colour,pace,csm,age,emoji,bg,one_line_summary,themes,neuro_pills,loud_sudden_sounds,flashing_lights,violence_detected,scary_content_detected,sensory_notes`;

      const res = await fetch('/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] }) });
      const data = await res.json();
      const text = data.content?.[0]?.text || '{}';
      const r = JSON.parse(text.replace(/```json|```/g, '').trim());
      return {
        v: r.violence ?? 0, f: r.fear_fantasy ?? 0, l: r.language_mild ?? 0, s: r.sex_nudity ?? 0,
        pos: r.positive_messages ?? 3, roles: r.role_models ?? 3, con: r.consumerism ?? 1, dr: r.drink_drugs ?? 0,
        calm: r.calm ?? 5, cuts: r.cuts ?? 5, colour: r.colour ?? 5, pace: r.pace ?? 5, csm: r.csm ?? 5,
        age: r.age || 'All ages', emoji: r.emoji || '🎬', bg: r.bg || '#c8d8e8',
        _fear_realistic: r.fear_realistic ?? 0, _language_freq: r.language_freq ?? 0, _social_safety: r.social_safety ?? 0,
        _neuro_pills: r.neuro_pills || [], _loud_sudden_sounds: r.loud_sudden_sounds ?? false, _flashing_lights: r.flashing_lights ?? false,
        _one_line_summary: r.one_line_summary || '', _sensory_notes: r.sensory_notes || '', themes: r.themes || []
      };

    function extractUKRating(results) {
      if (!results) return null;
      const uk = results.find(r => r.iso_3166_1 === 'GB');
      return uk?.rating_descriptions?.[0]?.rating || uk?.ratings?.[0]?.rating || null;
    }
    function extractUKMovieRating(results) {
      if (!results) return null;
      const uk = results.find(r => r.iso_3166_1 === 'GB');
      return uk?.release_dates?.[0]?.certification || null;
    }

    // ═══ FULL AI ASSESSMENT ═══
    async function runAIAssessment() {
      const btn = document.getElementById('btn-ai-assess');
      const status = document.getElementById('ai-assess-status');
      const title = document.getElementById('f-title')?.value || currentShow?.title || '';
      const type = document.getElementById('f-type')?.value || 'tv';
      const synopsis = document.getElementById('f-synopsis')?.value || '';
      const ageRating = document.getElementById('f-rating')?.value || '';
      const trailer = document.getElementById('f-trailer')?.value?.trim() || '';
      const genres = (document.getElementById('f-genres')?.value || '').split(',').map(g => g.trim()).filter(Boolean);
      if (!title) { toast('Add a title first', 'err'); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Analysing…'; status.textContent = '';
      const hasVideo = !!trailer;
      const sourceTier = hasVideo ? 'glimpsy-ai-trailer' : 'glimpsy-ai-text';
      try {
        const requests = [
          fetch('/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, type, synopsis, age_rating: ageRating, genres }) }).then(r => r.json())
        ];
        if (hasVideo) requests.push(fetch('/api/gemini', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ youtubeUrl: trailer, title, type }) }).then(r => r.json()));
        const results = await Promise.allSettled(requests);
        const claudeResult = results[0].status === 'fulfilled' ? results[0].value : null;
        const geminiResult = hasVideo && results[1]?.status === 'fulfilled' ? results[1].value : null;
        if (!claudeResult) throw new Error('Claude scoring failed');
        const merged = mergeAssessment(claudeResult, geminiResult, sourceTier);
        prefillSliders(merged);
        window._lastAIScores = {
          ...window._lastAIScores,
          _neuro_pills: merged._neuro_pills || [],
          _one_line_summary: merged.one_line_summary || merged._one_line_summary || '',
          _sensory_notes: merged.sensory_notes || merged._sensory_notes || '',
          _loud_sudden_sounds: merged.loud_sudden_sounds ?? false,
          _flashing_lights: merged.flashing_lights ?? false,
          _fear_realistic: merged.fear_realistic ?? merged.fear_final ?? 0,
          _social_safety: merged.social_safety ?? 0,
          _language_freq: merged.language_freq ?? 0
        };
        const summaryBlock = document.getElementById('ai-summary-block');
        if (summaryBlock) { summaryBlock.innerHTML = buildAISummaryHTML(merged, currentShow?.id || ''); summaryBlock.style.display = ''; }
        const tierLabel = { 'glimpsy-ai-full-episode': '✓ Measured from full episode', 'glimpsy-ai-trailer': '~ Measured from official trailer', 'glimpsy-ai-text': '◌ Estimated from synopsis' }[sourceTier];
        status.textContent = tierLabel; status.style.color = 'var(--sage-light)';
        toast(geminiResult ? '✦ Gemini + Claude complete' : '✦ Claude text assessment complete', 'ok');
      } catch (e) {
        status.textContent = 'Failed — ' + e.message; status.style.color = 'var(--red)';
        toast('Assessment failed', 'err');
      } finally { btn.disabled = false; btn.innerHTML = '✦ Run AI Assessment'; }
    }

    // ═══ PILL HELPERS ═══
    function derivePills(scores) {
      const pos = scores.pos ?? scores.positive_messages ?? 0;
      const pills = [];
      if (scores.calm >= 7 && scores.colour <= 4) pills.push('low-sensory-load');
      if (scores.calm >= 7 && scores.colour <= 4 && scores.cuts <= 3) pills.push('autism-friendly');
      if (scores.themes?.includes('repetitive-structure') && scores.calm >= 7) pills.push('stimming-friendly');
      if (scores.pace >= 2 && scores.pace <= 5 && !scores.loud_sudden_sounds && pos >= 3) pills.push('adhd-engagement');
      if (scores.calm >= 7 && scores.pace <= 4) pills.push('calming-transition');
      if (scores.themes?.includes('clear-narrative') && pos >= 3) pills.push('executive-function');
      if (scores.calm <= 4 || (scores.fear_fantasy ?? 0) >= 3 || (scores.fear_realistic ?? 0) >= 3) pills.push('co-viewing-recommended');
      if (scores.calm >= 8 && scores.pace <= 2) pills.push('bedtime-safe');
      return pills;
    }

    function mergeAssessment(claude, gemini, sourceTier) {
      const merged = { ...claude, source: sourceTier };
      const claudeScores = {
        calm: merged.calm ?? 5, colour: merged.colour ?? 3, pace: merged.pace ?? 3, cuts: merged.cuts ?? 3,
        pos: merged.pos ?? merged.positive_messages ?? 0, themes: merged.themes || [],
        fear_fantasy: merged.fear_fantasy ?? 0, fear_realistic: merged.fear_realistic ?? 0,
        loud_sudden_sounds: false
      };
      if (gemini?.sensory_index) {
        merged.calm   = Math.round((gemini.sensory_index.overall_score / 5) * 10);
        merged.colour = Math.round((gemini.sensory_index.colour_intensity / 5) * 10);
        merged.pace   = Math.round((gemini.sensory_index.edit_pace / 5) * 10);
        merged.cuts   = Math.round(gemini.sensory_index.scene_cuts_per_minute * 2);
        merged._audio_stress = gemini.sensory_index.audio_stress_level;
      }
      if (gemini?.flags) {
        merged.loud_sudden_sounds    = gemini.flags.loud_sudden_sounds;
        merged.flashing_lights       = gemini.flags.flashing_lights;
        merged.orienting_reflex      = gemini.flags.orienting_reflex;
        merged._sensory_notes        = gemini.sensory_notes || '';
        merged._visual_justification = gemini.visual_justifications?.note || '';
      }
      merged.fear_final = Math.max(claude.fear_fantasy ?? 0, claude.fear_realistic ?? 0, (gemini?.flags?.loud_sudden_sounds) ? 2 : 0);
      if (gemini?.flags?.violence_detected && (claude.violence ?? 0) < 2) merged.v = 2;
      merged._one_line_summary = claude.one_line_summary || '';
      merged._sensory_notes = merged._sensory_notes || claude.sensory_notes || '';
      const claudePills = derivePills(claudeScores);
      const geminiScores = {
        calm: merged.calm, colour: merged.colour, pace: merged.pace, cuts: merged.cuts,
        pos: merged.pos ?? merged.positive_messages ?? 0, themes: merged.themes || [],
        fear_fantasy: merged.fear_fantasy ?? 0, fear_realistic: merged.fear_realistic ?? 0,
        loud_sudden_sounds: merged.loud_sudden_sounds ?? false
      };
      const geminiPills = gemini ? derivePills(geminiScores) : [];
      const allPillIds = [...new Set([...claudePills, ...geminiPills])];
      merged._pill_provenance = {};
      allPillIds.forEach(p => {
        merged._pill_provenance[p] = { claude: claudePills.includes(p), gemini: geminiPills.includes(p), active: true, edited: false };
      });
      merged._neuro_pills = allPillIds;
      return merged;
    }

    function prefillSliders(a) {
      const map = {
        v: a.v ?? a.violence ?? null, f: a.f ?? a.fear_fantasy ?? null, l: a.l ?? a.language_mild ?? null, s: a.s ?? a.sex_nudity ?? null,
        pos: a.pos ?? a.positive_messages ?? null, roles: a.roles ?? a.role_models ?? null, con: a.con ?? a.consumerism ?? null, dr: a.dr ?? a.drink_drugs ?? null,
        calm: a.calm ?? null, cuts: a.cuts ?? null, colour: a.colour ?? null, pace: a.pace ?? null
      };
      Object.entries(map).forEach(([k, val]) => {
        if (val === null || val === undefined) return;
        const slider = document.getElementById('f-' + k);
        if (!slider) return;
        slider.value = val;
        slider.dispatchEvent(new Event('input'));
      });
      const ageVal = a.age || a.age_recommendation;
      if (ageVal) { const el = document.getElementById('f-age'); if (el) el.value = ageVal; }
      document.querySelectorAll('#themes-wrap .chip').forEach(c => c.classList.remove('on'));
      if (a.themes?.length) a.themes.forEach(t => { const c = document.querySelector(`#themes-wrap .chip[data-theme="${t}"]`); if (c) c.classList.add('on'); });
    }

    // ═══ AI SUMMARY ═══
    function buildAISummaryHTML(e, dbId) {
      const provenance = e._pill_provenance || {};
      const activeFlags = {
        loud_sudden_sounds: e.loud_sudden_sounds ?? e._loud_sudden_sounds ?? false,
        flashing_lights: e.flashing_lights ?? e._flashing_lights ?? false,

      };
      const activePills = e._neuro_pills || [];
      return `
        ${e._one_line_summary ? `<div style="font-size:.82rem;color:var(--text);margin-bottom:10px;line-height:1.5;">💬 <strong>For parents:</strong> ${e._one_line_summary}</div>` : ''}
        ${(e._sensory_notes || e._visual_justification) ? `<div style="font-size:.75rem;color:var(--muted);margin-bottom:14px;line-height:1.5;">🧠 <strong>Sensory:</strong> ${e._sensory_notes || ''}${e._visual_justification ? `<br><span style="opacity:.7">${e._visual_justification}</span>` : ''}</div>` : ''}
        <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--light);margin-bottom:6px;">Neuro pills <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">— click to toggle</span></div>
        <div style="font-size:.58rem;color:var(--light);margin-bottom:8px;"><span style="color:#4a9eff;">●</span> Claude &nbsp;<span style="color:#4acf8a;">●</span> Gemini &nbsp;<span style="color:var(--terra-light);">✏</span> Edited</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
          ${ALL_NEURO_PILLS.map(p => {
            const prov = provenance[p];
            const isOn = prov ? prov.active : activePills.includes(p);
            const edited = prov?.edited || false;
            const fromClaude = prov?.claude || false;
            const fromGemini = prov?.gemini || false;
            let dots = '';
            if (edited) { dots = ` <span style="font-size:.55rem;opacity:.8;color:var(--terra-light);">✏</span>`; }
            else if (fromClaude && fromGemini) { dots = ` <span style="font-size:.5rem;"><span style="color:#4a9eff;">●</span><span style="color:#4acf8a;">●</span></span>`; }
            else if (fromClaude) { dots = ` <span style="font-size:.5rem;color:#4a9eff;">●</span>`; }
            else if (fromGemini) { dots = ` <span style="font-size:.5rem;color:#4acf8a;">●</span>`; }
            const claudeOnlyOff = fromClaude && !fromGemini && !isOn;
            let chipClass = 'chip';
            let extraStyle = '';
            if (isOn) { chipClass += ' on sage'; }
            else if (claudeOnlyOff) { extraStyle = 'opacity:.45;'; }
            return `<button class="${chipClass}" data-pill="${p}" data-item="${dbId}" data-prov='${JSON.stringify(prov || {claude:false,gemini:false,active:false,edited:false})}' onclick="toggleNeuroPillChip(this)" style="${extraStyle}">${p}${dots}</button>`;
          }).join('')}
        </div>
        <div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--light);margin-bottom:8px;">Warning flags <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);">— click to toggle</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${ALL_WARNING_FLAGS.map(f => {
            const on = activeFlags[f.id];

          }).join('')}
        </div>`;
    }

    function toggleNeuroPillChip(el) {
      const isOn = el.classList.toggle('on');
      el.classList.toggle('sage', isOn);
      try {
        const prov = JSON.parse(el.dataset.prov || '{}');
        prov.active = isOn; prov.edited = true;
        el.dataset.prov = JSON.stringify(prov);
        const existingDot = el.querySelector('span');
        if (existingDot) existingDot.remove();
        el.insertAdjacentHTML('beforeend', `<span style="font-size:.55rem;opacity:.8;color:var(--terra-light);"> ✏</span>`);
      } catch (e) { /* ignore */ }
      if (isOn) el.style.opacity = '';
      if (!window._lastAIScores) window._lastAIScores = {};
      window._lastAIScores._neuro_pills = [...document.querySelectorAll('[data-pill].on')].map(b => b.dataset.pill);
    }

    function toggleWarningFlag(el) {
      const isOn = el.classList.toggle('on');
      el.classList.toggle('red', isOn);
      if (!window._lastAIScores) window._lastAIScores = {};
      const flag = el.dataset.flag;
      if (flag === 'loud_sudden_sounds') window._lastAIScores._loud_sudden_sounds = isOn;
      if (flag === 'flashing_lights') window._lastAIScores._flashing_lights = isOn;
    }

    // ═══ SLIDER + UI HELPERS ═══
    function updateSliderVal(key, val) {
      const el = document.getElementById('sv-' + key);
      if (!el) return;
      el.textContent = val;
      const n = parseInt(val);
      const highIsGood = ['calm', 'pos', 'roles'];
      const lowIsGood = ['v', 'f', 'l', 's', 'con', 'dr', 'cuts', 'colour', 'pace'];
      const max10 = ['calm', 'cuts', 'colour', 'pace'];
      let level;
      if (highIsGood.includes(key)) { const max = max10.includes(key) ? 10 : 5; const pct = n / max; level = pct >= 0.6 ? 0 : pct >= 0.3 ? 1 : 2; }
      else if (lowIsGood.includes(key)) { const max = max10.includes(key) ? 10 : 5; const pct = n / max; level = pct <= 0.3 ? 0 : pct <= 0.6 ? 1 : 2; }
      else { level = 1; }
      el.className = `slider-val sv-${level === 0 ? '0' : level === 1 ? '2' : '4'}`;
    }

    function updatePosterPreview(val, type) {
      const preview = document.getElementById('poster-preview');
      if (!preview) return;
      const isExternal = type === 'book' || val.startsWith('http');
      const url = isExternal ? val : (val ? TMDB_IMG + val : null);
      preview.innerHTML = url ? `<img src="${url}" onerror="this.parentNode.textContent='🎬'">` : '🎬';
    }

    function toggleTheme(btn) { btn.classList.toggle('on'); }

    function addCustomTheme() {
      const inp = document.getElementById('custom-theme');
      const val = inp.value.trim().toLowerCase().replace(/\s+/g, '-');
      if (!val) return;
      const wrap = document.getElementById('themes-wrap');
      const btn = document.createElement('button');
      btn.className = 'chip on'; btn.textContent = val.replace(/-/g, ' '); btn.dataset.theme = val; btn.onclick = () => btn.classList.toggle('on');
      wrap.appendChild(btn); inp.value = '';
    }

    function addPlatformRow() {
      const wrap = document.getElementById('platforms-wrap');
      const i = wrap.children.length;
      const div = document.createElement('div');
      div.className = 'form-grid'; div.style.cssText = 'margin-bottom:8px;align-items:end;'; div.id = 'plat-' + i;
      div.innerHTML = `<div class="field"><label class="label">Platform name</label><input class="input plat-name" value=""></div><div class="field"><label class="label">Icon emoji</label><input class="input plat-icon" value="" style="font-size:1rem;" maxlength="2"></div><div class="field"><label class="label">Type / price</label><input class="input plat-type" value=""></div><div class="field"><label class="label">URL</label><input class="input plat-url" value=""></div>`;
      wrap.appendChild(div);
    }

    // ═══ TVMAZE EPISODES ═══
    async function fetchEpisodes() {
      const title = document.getElementById('f-title')?.value?.trim();
      const status = document.getElementById('eps-status');
      const wrap = document.getElementById('eps-wrap');
      if (!title) { toast('Add a title first', 'err'); return; }
      status.textContent = 'Fetching from TVmaze…';
      status.style.color = 'var(--muted)';
      try {
        const res = await fetch(`/api/tvmaze?title=${encodeURIComponent(title)}`);
        const data = await res.json();
        if (!res.ok) {
          status.textContent = '✕ ' + (data.error || 'Not found on TVmaze');
          status.style.color = 'var(--red)';
          return;
        }
        window._lastEpisodes = data.episodes;
        wrap.style.display = 'block';
        wrap.innerHTML = renderEpisodeList(data.episodes);
        status.textContent = `✓ ${data.episode_count} episodes fetched`;
        status.style.color = 'var(--sage-light)';
        toast(`📺 ${data.episode_count} episodes loaded from TVmaze`, 'ok');
      } catch (e) {
        status.textContent = '✕ Failed: ' + e.message;
        status.style.color = 'var(--red)';
      }
    }

    // ═══ EPISODE AI TAGGING ═══
    async function tagEpisodesWithAI() {
      const episodes = (window._lastEpisodes || currentShow?.eps || []).map(ep => ({ ...ep }));
      const btn = document.getElementById('btn-tag-eps');
      const status = document.getElementById('eps-status');
      const showTitle = document.getElementById('f-title')?.value || currentShow?.title || '';
      const toTag = episodes.filter(ep => ep.synopsis && ep.synopsis.trim());
      if (!toTag.length) { toast('No episodes with synopses to tag', 'err'); return; }
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Tagging…';
      status.textContent = `0 / ${toTag.length}…`;
      status.style.color = 'var(--muted)';
      let done = 0;
      for (const ep of toTag) {
        try {
          const epRef = `S${ep.season}E${ep.number} "${ep.title}"`;
          const prompt = `You are a children's content analyst for Glimpsy. Tag this single TV episode for parents.

SHOW: "${showTitle}"
EPISODE: ${epRef}
SYNOPSIS: "${ep.synopsis}"

Return ONLY valid JSON with exactly these two keys — no preamble, no markdown:
{
  "themes": [],
  "neuro_pills": []
}

themes — pick only what clearly appears in THIS episode from:
death, monsters, bullying, toilet-humour, mild-violence, scary, divorce, grief, guns, educational, positive-friendship, positive-empathy, family-values, family-conflict, mild-language, social-skills, sensory-friendly, repetitive-structure, clear-narrative

neuro_pills — pick from:
low-sensory-load, autism-friendly, stimming-friendly, adhd-engagement, calming-transition, executive-function, co-viewing-recommended, bedtime-safe

Be conservative. Only include tags clearly supported by the synopsis.`;
          const res = await fetch('/api/score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: [{ role: 'user', content: prompt }] })
          });
          const data = await res.json();
          const rawText = data?.content?.[0]?.text || '{}';
          const parsed = JSON.parse(rawText.replace(/```json|```/g, '').trim());
          ep.th = parsed.themes || [];
          ep.np = parsed.neuro_pills || [];
        } catch (err) {
          console.warn('Failed to tag episode:', ep.title, err);
        }
        done++;
        status.textContent = `${done} / ${toTag.length} tagged…`;
        await new Promise(r => setTimeout(r, 150));
      }
      // Merge tags back into full episodes array (un-tagged eps keep their original data)
      const tagMap = {};
      toTag.forEach(ep => { tagMap[ep.tvmaze_id ?? (ep.season + '-' + ep.number)] = ep; });
      const merged = episodes.map(ep => {
        const key = ep.tvmaze_id ?? (ep.season + '-' + ep.number);
        return tagMap[key] || ep;
      });
      window._lastEpisodes = merged;
      const wrap = document.getElementById('eps-wrap');
      if (wrap) { wrap.style.display = 'block'; wrap.innerHTML = renderEpisodeList(merged); }
      btn.disabled = false; btn.innerHTML = '✦ Tag episodes with AI';
      status.textContent = `✓ ${done} episodes tagged`;
      status.style.color = 'var(--sage-light)';
      toast(`✦ ${done} episodes tagged — save the show to persist`, 'ok');
    }

    function renderEpisodeList(episodes) {
      if (!episodes || !episodes.length) return '<div style="font-size:.75rem;color:var(--muted);">No episodes found.</div>';
      const seasons = {};
      episodes.forEach(ep => {
        const s = ep.season || 1;
        if (!seasons[s]) seasons[s] = [];
        seasons[s].push(ep);
      });
      return Object.entries(seasons).map(([season, eps]) => `
        <details style="margin-bottom:8px;" ${season === '1' ? 'open' : ''}>
          <summary style="cursor:pointer;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 0;list-style:none;display:flex;align-items:center;gap:8px;">
            <span style="color:var(--terra-light);">▶</span> Season ${season} <span style="font-weight:400;color:var(--light);">(${eps.length} episodes)</span>
          </summary>
          <div style="margin-top:4px;border-left:2px solid var(--border2);padding-left:12px;">
            ${eps.map(ep => `
              <div style="padding:10px 0;border-bottom:1px solid var(--border);">
                <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px;">
                  <span style="font-size:.6rem;font-weight:700;color:var(--light);flex-shrink:0;">S${String(ep.season).padStart(2,'0')}E${String(ep.number).padStart(2,'0')}</span>
                  <span style="font-size:.8rem;font-weight:500;color:var(--text);">${escHtml(ep.title || 'Untitled')}</span>
                  ${ep.duration ? `<span style="font-size:.6rem;color:var(--light);margin-left:auto;flex-shrink:0;">${ep.duration}m</span>` : ''}
                </div>
                ${ep.synopsis ? `<div style="font-size:.72rem;color:var(--muted);line-height:1.6;">${escHtml(ep.synopsis.slice(0, 200))}${ep.synopsis.length > 200 ? '…' : ''}</div>` : ''}
                ${(ep.th && ep.th.length) ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">${ep.th.map(t => `<span style="font-size:.58rem;padding:2px 8px;border-radius:10px;background:var(--terra-pale);color:var(--terra-light);border:1px solid rgba(201,106,58,.2);">${t.replace(/-/g,' ')}</span>`).join('')}</div>` : ''}
                ${(ep.np && ep.np.length) ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">${ep.np.map(p => `<span style="font-size:.58rem;padding:2px 8px;border-radius:10px;background:var(--sage-pale);color:var(--sage-light);border:1px solid rgba(74,112,85,.2);">🧠 ${p.replace(/-/g,' ')}</span>`).join('')}</div>` : ''}
                ${ep.airdate ? `<div style="font-size:.62rem;color:var(--light);margin-top:3px;">${ep.airdate}</div>` : ''}
              </div>`).join('')}
          </div>
        </details>`).join('');
    }
    
    // ═══ SAVE ═══
    async function saveShow() {
      const statusEl = document.getElementById('save-status');
      const saveBtn = document.getElementById('save-btn');
      if (saveBtn) saveBtn.disabled = true;
      if (statusEl) { statusEl.className = 'save-status'; statusEl.textContent = 'Saving…'; }
      try {
        const dbId = document.getElementById('f-dbid').value;
        const isUpdate = !!dbId;
        let id;
        if (isUpdate) { id = parseInt(document.getElementById('f-id').value); }
        else { const maxRes = await sbFetch('shows?select=id&order=id.desc&limit=1'); id = maxRes && maxRes.length ? maxRes[0].id + 1 : 1; document.getElementById('f-id').value = id; }

        const themes = [...document.querySelectorAll('#themes-wrap .chip.on')].map(c => c.dataset.theme);
        const platRows = document.querySelectorAll('#platforms-wrap .form-grid');
        const platforms = [...platRows].map(row => ({ n: row.querySelector('.plat-name')?.value?.trim() || '', i: row.querySelector('.plat-icon')?.value?.trim() || '', t: row.querySelector('.plat-type')?.value?.trim() || '', url: row.querySelector('.plat-url')?.value?.trim() || '' })).filter(p => p.n);
        const posterType = document.getElementById('f-poster-type')?.value || null;
        const activePills = [...document.querySelectorAll('[data-pill].on')].map(b => b.dataset.pill);
        const flagOn = (id) => !!document.querySelector(`[data-flag="${id}"].on`);
        const ai = window._lastAIScores, cs = currentShow;

        const payload = {
          id, type: document.getElementById('f-type').value,
          title: document.getElementById('f-title').value.trim(),
          emoji: document.getElementById('f-emoji').value.trim(),
          bg: document.getElementById('f-bg').value.trim(),
          poster: document.getElementById('f-poster').value.trim() || null,
          poster_type: posterType || null,
          age: document.getElementById('f-age').value.trim(),
          seasons: parseInt(document.getElementById('f-seasons').value) || null,
          dur: parseInt(document.getElementById('f-dur').value) || null,
          rating: document.getElementById('f-rating').value,
          csm: parseInt(document.getElementById('f-csm').value) || 5,
          genres: document.getElementById('f-genres').value.split(',').map(g => g.trim()).filter(Boolean),
          v: parseInt(document.getElementById('f-v').value),
          f: parseInt(document.getElementById('f-f').value),
          l: parseInt(document.getElementById('f-l').value),
          s: parseInt(document.getElementById('f-s').value),
          pos: parseInt(document.getElementById('f-pos').value),
          roles: parseInt(document.getElementById('f-roles').value),
          con: parseInt(document.getElementById('f-con').value),
          dr: parseInt(document.getElementById('f-dr').value),
          calm: parseInt(document.getElementById('f-calm').value),
          cuts: parseInt(document.getElementById('f-cuts').value),
          colour: parseInt(document.getElementById('f-colour').value),
          pace: parseInt(document.getElementById('f-pace').value),
          themes, platforms,
          synopsis: document.getElementById('f-synopsis').value.trim(),
          trailer: document.getElementById('f-trailer').value.trim() || null,
          eps: window._lastEpisodes || (cs?.eps || []),
          neuro_pills: activePills.length ? activePills : (ai ? ai._neuro_pills : cs?.neuro_pills || []),
          one_line_summary: ai ? ai._one_line_summary : cs?.one_line_summary || null,
          sensory_notes: ai ? ai._sensory_notes : cs?.sensory_notes || null,
          loud_sudden_sounds: flagOn('loud_sudden_sounds') || (ai ? ai._loud_sudden_sounds : cs?.loud_sudden_sounds ?? false),
          flashing_lights: flagOn('flashing_lights') || (ai ? ai._flashing_lights : cs?.flashing_lights ?? false),
          fear_realistic: ai ? ai._fear_realistic : cs?.fear_realistic ?? 0,
          social_safety: ai ? ai._social_safety : cs?.social_safety ?? 0,
          language_freq: ai ? ai._language_freq : cs?.language_freq ?? 0
        };

        if (isUpdate) {
          await sbFetch(`shows?id=eq.${dbId}`, { method: 'PATCH', prefer: 'return=minimal', body: JSON.stringify(payload) });
          const idx = SHOWS.findIndex(s => s.id === parseInt(dbId));
          if (idx > -1) SHOWS[idx] = { ...SHOWS[idx], ...payload, id: parseInt(dbId) };
          toast('✅ Saved!', 'ok');
        } else {
          await sbFetch('shows', { method: 'POST', prefer: 'return=minimal', body: JSON.stringify(payload) });
          SHOWS.push({ ...payload }); currentShow = payload; document.getElementById('f-dbid').value = id;
          toast('✅ Added to Supabase!', 'ok');
        }
        if (statusEl) { statusEl.className = 'save-status ok'; statusEl.textContent = '✓ Saved successfully'; }
        renderSidebar();
      } catch (e) {
        if (statusEl) { statusEl.className = 'save-status err'; statusEl.textContent = '✕ Error: ' + e.message; }
        toast('Error saving: ' + e.message, 'err');
      }
      if (saveBtn) saveBtn.disabled = false;
    }

    // ═══ DELETE ═══
    async function deleteShow(id, title) {
      if (!confirm(`Delete "${title}" from Supabase? This cannot be undone.`)) return;
      try {
        await sbFetch(`shows?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
        SHOWS = SHOWS.filter(s => s.id !== id); currentShow = null; renderSidebar(); showSearch();
        toast(`🗑 "${title}" deleted`, 'ok');
      } catch (e) { toast('Delete failed: ' + e.message, 'err'); }
    }

    function escHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    function toast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(t._timer); t._timer = setTimeout(() => t.className = 'toast', 2800);
    }

    loadShows();
  </script>
</body>

</html>
